<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务花园 — 打卡成功，花开满枝 · 拖延失败，入土为安</title>
<style>
:root {
  --bg:#2a3820; --panel-bg:rgba(38,50,28,0.95); --text:#e8e4d8; --text-dim:#b0b8a0;
  --accent:#e0c860; --accent-glow:#f8f0a0; --success:#90d870; --success-glow:#b8f898;
  --danger:#d87058; --danger-glow:#f89880; --border:rgba(180,200,160,0.25);
  --radius:12px; --shadow:0 4px 24px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100vh}

#header{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:linear-gradient(180deg,rgba(30,42,20,0.98),rgba(30,42,20,0.92));border-bottom:1px solid var(--border);z-index:100;backdrop-filter:blur(10px);gap:12px}
#header .title{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent-glow),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
#nav{display:flex;gap:4px}
#nav button{padding:8px 18px;border:1px solid transparent;border-radius:20px;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px;transition:all .3s}
#nav button:hover{color:var(--text);border-color:var(--border)}
#nav button.active{color:var(--accent-glow);border-color:var(--accent);background:rgba(200,168,78,0.1)}
#stats-bar{display:flex;gap:14px;font-size:12px;color:var(--text-dim);flex-wrap:wrap}
#stats-bar span{display:flex;align-items:center;gap:3px}
#stats-bar .streak{color:var(--accent-glow);font-weight:600}

#main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.active{display:flex}

#garden-view{flex-direction:column}
#garden-canvas{flex:1;display:block}
#garden-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:20px;background:rgba(0,0,0,0.7);color:var(--accent-glow);font-size:13px;pointer-events:none;transition:opacity .5s}
#garden-info{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-dim);pointer-events:none}
#place-queue{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto}
.place-queue-item{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;background:var(--panel-bg);border:1px solid var(--border);font-size:13px;cursor:pointer;transition:all .2s}
.place-queue-item:hover{border-color:var(--accent)}
.place-queue-item .pq-icon{font-size:20px}

#task-view{flex-direction:column;padding:16px;overflow-y:auto;gap:12px}
#task-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#task-toolbar button{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--panel-bg);color:var(--text);cursor:pointer;font-size:13px;transition:all .2s}
#task-toolbar button:hover{border-color:var(--accent)}
#task-toolbar button.filter-active{background:rgba(200,168,78,0.2);border-color:var(--accent)}
#btn-add-task{margin-left:auto;background:linear-gradient(135deg,rgba(200,168,78,0.3),rgba(200,168,78,0.1))!important;border-color:var(--accent)!important;color:var(--accent-glow)!important;font-weight:600}
#task-list{display:flex;flex-direction:column;gap:10px}

.task-card{position:relative;padding:14px 18px;border-radius:var(--radius);background:var(--panel-bg);border:1px solid var(--border);transition:all .4s;overflow:hidden}
.task-card:hover{border-color:rgba(200,168,78,0.4)}
.task-card.completed{border-color:var(--success);box-shadow:0 0 20px rgba(140,200,104,0.2),inset 0 0 20px rgba(140,200,104,0.05)}
.task-card.failed{border-color:var(--danger);box-shadow:0 0 20px rgba(200,92,72,0.15);opacity:0.8}
.task-card .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px}
.task-card .card-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.task-card .card-type{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(200,168,78,0.15);color:var(--accent)}
.task-card .card-type.long{background:rgba(160,140,200,0.15);color:#b8a8e0}
.task-card .card-status{font-size:12px;padding:3px 10px;border-radius:10px}
.task-card .card-status.pending{background:rgba(200,168,78,0.1);color:var(--accent)}
.task-card .card-status.completed{background:rgba(140,200,104,0.15);color:var(--success)}
.task-card .card-status.failed{background:rgba(200,92,72,0.15);color:var(--danger)}
.task-card .card-details{font-size:13px;color:var(--text-dim);margin:4px 0}
.task-card .card-details span{margin-right:12px}
.task-card .card-notes{font-size:12px;color:var(--text-dim);font-style:italic;margin-top:4px}
.task-card .card-actions{display:flex;gap:8px;margin-top:10px}
.task-card .card-actions button{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:12px;transition:all .2s}
.task-card .card-actions button:hover{border-color:var(--accent)}
.task-card .btn-checkin{background:linear-gradient(135deg,rgba(140,200,104,0.3),rgba(140,200,104,0.1))!important;border-color:var(--success)!important;color:var(--success-glow)!important}
.task-card .btn-checkin:hover{box-shadow:0 0 12px rgba(140,200,104,0.3)}
.task-card .btn-delete{color:var(--danger)!important;border-color:transparent!important}
.task-card.completed::before{content:'';position:absolute;top:-20px;left:10%;width:2px;height:20px;background:var(--success);animation:branchGrow .6s ease-out forwards}
.task-card.completed::after{content:'';position:absolute;top:-30px;left:10%;width:30px;height:30px;background:radial-gradient(circle,#f0a0b8 0%,#f0a0b8 30%,transparent 70%);border-radius:50%;animation:flowerBloom .8s .4s ease-out forwards;opacity:0}
@keyframes branchGrow{from{height:0}to{height:20px}}
@keyframes flowerBloom{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.task-card.failed{border-radius:6px 6px 12px 12px}
.task-card.failed::before{content:'⚰️';position:absolute;top:8px;right:16px;font-size:24px;animation:coffinDrop .6s ease-out}
@keyframes coffinDrop{from{transform:translateY(-40px);opacity:0}to{transform:translateY(0);opacity:1}}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--panel-bg);border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-width:380px;max-width:90vw;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto;animation:modalIn .3s ease-out}
@keyframes modalIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h2{font-size:20px;margin-bottom:16px;color:var(--accent-glow)}
.modal h3{font-size:15px;color:var(--text);margin:10px 0 6px}
.modal label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent)}
.modal textarea{resize:vertical;min-height:60px}
.modal .btn-row{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.modal button{padding:10px 24px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:14px;transition:all .2s}
.modal button:hover{filter:brightness(1.2)}
.modal button.btn-primary{background:linear-gradient(135deg,rgba(200,168,78,0.4),rgba(200,168,78,0.2));border-color:var(--accent);color:var(--accent-glow)}
.modal button.btn-danger{background:linear-gradient(135deg,rgba(200,92,72,0.3),rgba(200,92,72,0.1));border-color:var(--danger);color:var(--danger-glow)}

#toast-container{position:fixed;top:70px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:20px;font-size:14px;animation:toastIn .4s ease-out,toastOut .4s 2.8s ease-in forwards;box-shadow:var(--shadow);max-width:360px;line-height:1.4}
.toast.success{background:rgba(140,200,104,0.92);color:#fff}
.toast.error{background:rgba(200,92,72,0.92);color:#fff}
.toast.info{background:rgba(224,200,96,0.92);color:#1a2410}
.toast.encourage{background:rgba(180,140,220,0.92);color:#fff;font-size:15px;font-weight:600;text-align:center}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}

#confetti-overlay{position:fixed;inset:0;pointer-events:none;z-index:1999}
.confetti-piece{position:absolute;width:12px;height:12px;animation:confettiFall linear forwards}
@keyframes confettiFall{
  0%{transform:translateY(-10vh) rotate(0deg) scale(1);opacity:1}
  80%{opacity:1}
  100%{transform:translateY(110vh) rotate(1080deg) scale(0.2);opacity:0}
}

#particle-overlay{position:fixed;inset:0;pointer-events:none;z-index:998}
.petal{position:absolute;border-radius:50%;animation:petalFall linear forwards}
@keyframes petalFall{
  0%{transform:translateY(-10vh) rotate(0deg) scale(1);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg) scale(0.3);opacity:0}
}

.achievement-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin:2px}
.achievement-badge.gold{background:rgba(240,200,80,0.2);color:#f0d050;border:1px solid rgba(240,200,80,0.4)}
.achievement-badge.silver{background:rgba(180,190,200,0.2);color:#c0d0e0;border:1px solid rgba(180,190,200,0.4)}
.achievement-badge.bronze{background:rgba(200,150,100,0.2);color:#d0a070;border:1px solid rgba(200,150,100,0.4)}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-dim);text-align:center}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.8}

/* ---- Schedule Parchment ---- */
.schedule-scroll{
  background:linear-gradient(135deg,#f4e4c1 0%,#e8d5a8 25%,#f5ead0 50%,#e6d2a0 75%,#f0dbb0 100%)!important;
  border:3px solid #c4a060!important;border-radius:6px 20px 6px 20px!important;
  box-shadow:0 8px 40px rgba(0,0,0,0.5),inset 0 0 60px rgba(180,140,80,0.15)!important;
  font-family:'Georgia','Noto Serif SC',serif!important;
  color:#3a2a10!important;
  animation:scrollUnfurl .6s ease-out!important;
  overflow:hidden;
}
.schedule-scroll h2{color:#5a3a18!important;text-align:center;font-size:22px;letter-spacing:2px;border-bottom:2px dashed #c4a060;padding-bottom:12px;margin-bottom:8px}
.schedule-scroll label{color:#5a3a18!important}
@keyframes scrollUnfurl{
  0%{max-height:0;opacity:0;transform:scaleY(0.3);transform-origin:top}
  60%{opacity:0.9}
  100%{max-height:85vh;opacity:1;transform:scaleY(1);transform-origin:top}
}
.schedule-list{max-height:280px;overflow-y:auto;margin-bottom:12px;padding-right:4px}
.schedule-section-label{font-size:13px;font-weight:700;color:#7a5a30;margin:8px 0 4px;padding-bottom:2px;border-bottom:1px dotted #c4a060}
.schedule-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:4px 0;background:rgba(255,252,240,0.5);border-radius:8px;border:1px solid rgba(180,140,80,0.2);font-size:13px;transition:all .2s}
.schedule-item:hover{background:rgba(255,252,240,0.8);border-color:rgba(180,140,80,0.5)}
.schedule-item .sched-title{flex:1;font-weight:500}
.schedule-item .sched-time{color:#7a5a30;font-size:12px;white-space:nowrap}
.schedule-item .sched-date-badge{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.schedule-item .sched-date-badge.today{background:#e8d5a8;color:#5a3a18}
.schedule-item .sched-date-badge.tomorrow{background:#d8c8e8;color:#4a3070}
.schedule-item .sched-del{background:none;border:none;color:#c08070;cursor:pointer;font-size:16px;padding:2px 6px;transition:all .2s}
.schedule-item .sched-del:hover{color:#d04030;transform:scale(1.2)}
.schedule-add-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.schedule-add-form input[type="text"]{flex:2;min-width:120px;padding:8px 12px;border-radius:8px;border:1px solid #c4a060;background:rgba(255,252,240,0.7);color:#3a2a10;font-size:13px;font-family:inherit;outline:none}
.schedule-add-form input[type="text"]:focus{border-color:#8a6030}
.schedule-add-form input[type="datetime-local"]{flex:1;min-width:140px;padding:8px 10px;border-radius:8px;border:1px solid #c4a060;background:rgba(255,252,240,0.7);color:#3a2a10;font-size:12px;font-family:inherit;outline:none}
.schedule-add-form select{flex:0;min-width:80px;padding:8px 10px;border-radius:8px;border:1px solid #c4a060;background:rgba(255,252,240,0.7);color:#3a2a10;font-size:13px;font-family:inherit;outline:none;cursor:pointer}
.schedule-add-form input:focus,.schedule-add-form select:focus{border-color:#8a6030}
.schedule-add-form button{padding:8px 16px;border-radius:20px;border:1px solid #8a6030;background:linear-gradient(135deg,rgba(180,130,70,0.3),rgba(180,130,70,0.1));color:#5a3a18;cursor:pointer;font-size:18px;font-weight:700;transition:all .2s}
.schedule-add-form button:hover{background:rgba(180,130,70,0.4);transform:scale(1.05)}
.schedule-empty{text-align:center;padding:30px 20px;color:#9a8a70;font-size:14px;font-style:italic}

/* ---- Two-column task split ---- */
#task-list.split-view{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.task-column{display:flex;flex-direction:column;gap:10px}
.task-column-header{font-size:14px;font-weight:600;color:var(--text-dim);padding:6px 0 2px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.task-card.completed.historical{background:linear-gradient(135deg,rgba(76,120,60,0.3),rgba(140,180,100,0.12))!important;border-color:rgba(120,180,100,0.3)!important}
.task-card.failed.historical{background:linear-gradient(135deg,rgba(60,50,70,0.45),rgba(30,25,35,0.5))!important;border-color:rgba(100,80,110,0.35)!important}

@media(max-width:640px){
  #header{padding:8px 12px;flex-wrap:wrap;gap:4px}
  #header .title{font-size:14px}
  #nav button{padding:6px 12px;font-size:12px}
  #stats-bar{font-size:10px;gap:6px}
  #task-view{padding:10px}
  .modal{min-width:auto;width:95vw;padding:16px}
  .task-card .card-header{flex-direction:column;align-items:flex-start}
  #task-list.split-view{grid-template-columns:1fr}
  .schedule-add-form{flex-direction:column}
  .schedule-add-form input[type="text"],.schedule-add-form input[type="datetime-local"],.schedule-add-form select{width:100%}
}
/* Auth styles */
.user-btn{cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel-bg);color:var(--text);font-size:12px;transition:all .2s;white-space:nowrap}
.user-btn:hover{border-color:var(--accent)}
.user-btn.logged-in{border-color:var(--accent);background:rgba(224,200,96,0.1)}
#modal-auth .auth-tabs{display:flex;gap:0;margin-bottom:16px}
#modal-auth .auth-tab{flex:1;padding:10px;text-align:center;cursor:pointer;border-bottom:2px solid var(--border);color:var(--text-dim);font-size:14px;transition:all .2s}
#modal-auth .auth-tab.active{border-bottom-color:var(--accent);color:var(--accent-glow)}
#modal-auth .auth-error{color:var(--danger-glow);font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <span class="title">🏡 任务花园</span>
    <nav id="nav">
      <button data-view="garden" class="active">🌾 荒野</button>
      <button data-view="tasks">📋 任务</button>
      <button data-view="achievements">🏆 成就</button>
      <button id="btn-schedule" onclick="app.openSchedule()">📜 日程</button>
    </nav>
    <div id="stats-bar">
      <span>🌸 <strong id="stat-completed">0</strong></span>
      <span>⚰️ <strong id="stat-failed">0</strong></span>
      <span>🌳 <strong id="stat-trees">0</strong></span>
      <span class="streak">🔥 <strong id="stat-streak">0</strong>天</span>
    </div>
    <button class="user-btn" id="user-btn" onclick="app.showSyncModal()" title="导出/导入同步码，跨设备同步数据">🔄 同步</button>
  </div>

  <div id="main">
    <div id="garden-view" class="view active">
      <canvas id="garden-canvas"></canvas>
      <div id="garden-info"></div>
      <div id="garden-hint">🖱️ 拖拽平移 | 滚轮缩放 | 完成任务的奖励可在此放置</div>
      <div id="place-queue"></div>
    </div>

    <div id="task-view" class="view">
      <div id="task-toolbar">
        <button class="filter-active" data-filter="all">全部</button>
        <button data-filter="short">⚡ 短期</button>
        <button data-filter="long">🎯 长期</button>
        <button data-filter="completed">✅ 已完成</button>
        <button data-filter="failed">❌ 已失败</button>
        <button id="btn-add-task">＋ 新建任务</button>
      </div>
      <div id="task-list"></div>
      <div id="empty-tasks" class="empty-state">
        <div class="empty-icon">📝</div>
        <p>还没有任务<br>点击「＋ 新建任务」开始规划你的一天<br><small>完成打卡可获得花朵，布置在荒野上</small></p>
      </div>
    </div>

    <div id="achievements-view" class="view">
      <div style="flex-direction:column;padding:20px;overflow-y:auto;width:100%;gap:16px;display:flex">
        <div id="achievements-content"></div>
        <div class="empty-state" id="empty-achievements">
          <div class="empty-icon">🏆</div>
          <p>还没有解锁成就<br>坚持打卡，解锁更多奖励！</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modals -->
<div id="modal-add" class="modal-overlay hidden">
  <div class="modal">
    <h2>📝 新建任务</h2>
    <label>任务名称</label>
    <input type="text" id="add-title" placeholder="例如：完成周报、跑步30分钟…" maxlength="60">
    <label>起止时间</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="datetime-local" id="add-starttime" style="flex:1">
      <span>至</span>
      <input type="datetime-local" id="add-deadline" style="flex:1">
    </div>
    <label>备注</label>
    <textarea id="add-notes" placeholder="可选备注…" maxlength="200"></textarea>
    <label>任务类型</label>
    <select id="add-type">
      <option value="short">⚡ 短期任务（今日事今日毕）</option>
      <option value="long-single">🎯 长期任务 — 单次完成</option>
      <option value="long-cumulative">📅 长期任务 — 累计打卡</option>
    </select>
    <div id="long-options" class="hidden">
      <label>任务周期</label>
      <select id="add-period">
        <option value="week">📅 一周</option>
        <option value="month">📅 一个月</option>
        <option value="quarter">📅 三个月</option>
        <option value="custom">📅 自定义天数</option>
      </select>
      <div id="custom-days-wrap" class="hidden">
        <label>累计打卡天数要求</label>
        <input type="number" id="add-custom-days" min="2" max="365" value="7">
      </div>
    </div>
    <div class="btn-row">
      <button onclick="app.closeModal('modal-add')">取消</button>
      <button class="btn-primary" onclick="app.addTask()">确认创建</button>
    </div>
  </div>
</div>

<div id="modal-extend" class="modal-overlay hidden">
  <div class="modal">
    <h2>⏰ 任务已超时</h2>
    <p style="color:var(--text-dim);margin-bottom:12px">你还有一次延期机会！设置新的截止时间：</p>
    <label>延长时间到</label>
    <input type="datetime-local" id="extend-deadline">
    <div class="btn-row">
      <button class="btn-danger" onclick="app.declineExtend()">放弃任务</button>
